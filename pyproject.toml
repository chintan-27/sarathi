[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarathi"
version = "0.1.0"
description = "AI-powered results-to-presentation tool"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "watchdog>=3.0",
    "ollama>=0.3",
    "playwright>=1.40",
    "Pillow>=10.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
sarathi = "sarathi.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sarathi"]
